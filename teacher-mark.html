<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>교사 기기</title>
<style>
:root{ --blue:#1255A0; --ink:#1A1A1A; --ink2:#555; --bg:#F4F6F8; --line:#DDD; }
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,'Noto Sans KR',sans-serif;font-size:16px}
main{max-width:460px;margin:60px auto;padding:0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px;line-height:1.7}
h1{font-size:19px;margin:0 0 14px;color:var(--blue)}
a{color:var(--blue)}
</style>
</head>
<body>
<main><div class="card">
  <h1>교사 기기 표시는 없앴습니다</h1>
  <p>2026-11-02 부터 <b>과학허브 학생 로그인에서 교사용 계정(20100)으로 로그인한 브라우저</b>가 교사 기기입니다.
  그 브라우저에서는 접속 기록이 「교사」로 남고, 과학허브 맨 아래에 🔐 교사 화면 카드가 보입니다.</p>
  <p>이 브라우저에 남아 있던 옛 표시는 지웠습니다.</p>
  <p><a href="./">과학허브로 가기</a></p>
</div></main>
<script>
/* 옛 교사 기기 표시(hubstats_teacher)를 지운다 — 교사 지시 2026-11-02 「교사용 기기 확인을 교사용 계정이랑 같은 걸로」 */
try { localStorage.removeItem('hubstats_teacher'); } catch (e) {}
</script>
</body>
</html>
