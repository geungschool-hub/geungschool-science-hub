<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>고은표 과학 허브 · Science Hub</title>
    <meta
      name="description"
      content="고은표 선생님이 만든 과학 인터랙티브 학습 콘텐츠를 한 곳에서 만나요."
    />
    <style>
      /* =========================================================
         고은표 과학 허브 — 단일 HTML 런처
         ▶ 콘텐츠 추가/수정은 아래 <script>의 CONTENTS 배열만 고치면 됩니다.
         ========================================================= */
      :root {
        --bg: #eef2f8;
        --bg2: #e3e9f3;
        --card: #ffffff;
        --text: #1a2230;
        --muted: #5b6675;
        --line: #d6deea;
        --accent: #1255a0;
        --shadow: 0 6px 22px rgba(20, 40, 80, 0.1);
        --shadow-hover: 0 12px 30px rgba(20, 40, 80, 0.18);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        font-family:
          'Pretendard', system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
        color: var(--text);
        background:
          radial-gradient(1100px 480px at 50% -180px, #d7e3f6 0%, transparent 70%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
        background-attachment: fixed;
        min-height: 100vh;
        line-height: 1.6;
      }
      .wrap {
        max-width: 1080px;
        margin: 0 auto;
        padding: 40px 20px 64px;
      }

      /* 헤더 */
      header {
        text-align: center;
        margin-bottom: 28px;
      }
      .logo {
        font-size: 40px;
        line-height: 1;
      }
      h1 {
        margin: 10px 0 6px;
        font-size: clamp(26px, 5vw, 38px);
        letter-spacing: -0.5px;
      }
      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: clamp(14px, 2.6vw, 17px);
      }
      .teacher {
        display: inline-block;
        margin-top: 12px;
        background: var(--accent);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        padding: 5px 14px;
        border-radius: 999px;
      }
      .home-link {
        display: inline-block;
        margin-top: 14px;
        color: var(--accent);
        background: #fff;
        border: 1px solid var(--line);
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
        padding: 8px 16px;
        border-radius: 999px;
        box-shadow: var(--shadow);
      }
      .home-link:hover {
        border-color: var(--accent);
      }

      /* 컨트롤(검색 + 필터) */
      .controls {
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
        margin: 26px 0 22px;
      }
      .search {
        width: min(420px, 100%);
        position: relative;
      }
      .search input {
        width: 100%;
        padding: 13px 16px 13px 42px;
        font-size: 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--text);
        box-shadow: var(--shadow);
      }
      .search input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .search .icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 16px;
        opacity: 0.5;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
      }
      .chip {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--muted);
        border-radius: 999px;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        min-height: 40px;
      }
      .chip.on {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }

      /* ── 과목 섹션 ──
         과목마다 색 띠를 두른 제목을 두고 그 아래에만 그 과목 카드를 모은다.
         생명과학 3개 · 생물의 유전 10개처럼 수가 크게 벌어져도 경계가 흐려지지 않는다. */
      .stack {
        display: flex;
        flex-direction: column;
        gap: 34px;
      }
      .sec-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding-bottom: 9px;
        margin-bottom: 15px;
        border-bottom: 3px solid var(--sc);
      }
      .sec-name {
        font-size: 20px;
        font-weight: 800;
        color: var(--sc);
        letter-spacing: -0.3px;
      }
      .sec-count {
        font-size: 13px;
        font-weight: 700;
        color: var(--sc);
        background: var(--sb);
        border-radius: 999px;
        padding: 3px 11px;
      }
      .sec-grid {
        display: grid;
        /* ★320px — 300px 으로 두었더니 창이 1000px 일 때 3열이 되면서 칸이 좀아져
           설명 일곱이 세 줄에서 잘렸다(실측). 320 이면 그 대에서 2열로 내려앉는다. */
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 14px;
      }

      /* ── 카드 — 가로형 ──
         이모지를 왼쪽으로 보내고 설명을 두 줄에서 자른다.
         과목 태그와 「열어 보기 →」 줄은 섹션 제목이 대신하므로 없앴다.
         ★한 줄의 높이는 그 줄에서 설명이 가장 긴 카드가 정한다 — 두 줄로 자르지 않으면
           카드 하나 때문에 줄 전체가 400px 까지 늘어난다(2026-09-14 실측). */
      .card {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 13px;
        align-items: start;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 16px;
        text-decoration: none;
        color: inherit;
        box-shadow: var(--shadow);
        transition:
          transform 0.16s ease,
          box-shadow 0.16s ease;
        position: relative;
      }
      a.card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-hover);
      }
      a.card:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      .card.soon {
        opacity: 0.72;
        cursor: default;
      }
      .ic {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 24px;
      }
      .bd {
        min-width: 0;
      }
      .card h2 {
        margin: 0 0 3px;
        font-size: 16.5px;
        line-height: 1.35;
      }
      .card p {
        margin: 0;
        color: var(--muted);
        font-size: 13.5px;
        line-height: 1.55;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .go {
        margin-left: 6px;
        font-size: 15px;
        font-weight: 400;
        color: #a9b0bd;
      }
      a.card:hover .go {
        color: var(--accent);
      }
      .badge-soon {
        font-size: 12px;
        font-weight: 700;
        color: #8a6d12;
        background: #fdeecb;
        padding: 4px 10px;
        border-radius: 999px;
      }

      .empty {
        text-align: center;
        color: var(--muted);
        padding: 40px 0;
        font-size: 15px;
      }

      footer {
        margin-top: 48px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        text-align: center;
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="logo">🔬</div>
        <h1 id="site-title">고은표 과학 허브</h1>
        <p class="subtitle" id="site-subtitle">
          한 곳에서 만나는 과학 인터랙티브 학습 — 눌러서 바로 체험해 보세요!
        </p>
        <span class="teacher">과학 · 고은표</span>
        <div><a class="home-link" href="https://geungschool-hub.github.io/">← 통합 허브</a></div>
      </header>

      <div class="controls">
        <div class="search">
          <span class="icon">🔍</span>
          <input
            id="search"
            type="search"
            placeholder="콘텐츠 검색 (예: 세포분열, 퀴즈)"
            aria-label="콘텐츠 검색"
          />
        </div>
        <div class="chips" id="chips" role="group" aria-label="과목 필터"></div>
      </div>

      <main class="stack" id="grid"></main>

      <footer>Claude AI로 이 앱을 제작함 by 고은표</footer>
    </div>

    <script>
      /* =========================================================
         ▼▼▼ 콘텐츠 목록 — 새 학습 콘텐츠를 만들면 여기에 한 칸만 추가하세요 ▼▼▼
         형식:
         {
           title:   '카드 제목',
           desc:    '한두 문장 설명',
           url:     'https://...'        // 배포된 콘텐츠 주소
           subject: '생명과학',           // 과목(자동으로 필터 칩이 생깁니다)
           emoji:   '🧬',                // 카드 아이콘
           status:  'live'              // 'live'(공개) 또는 'soon'(준비 중, url 없이 가능)
         }
         ========================================================= */
      const CONTENTS = [
        {
          title: 'ChromoLab',
          desc: '염색체를 직접 움직여 체세포분열과 감수분열을 만들어 보고, 수정으로 생기는 유전적 다양성까지 확인한다.',
          url: 'https://geungschool-hub.github.io/chromolab/',
          subject: '생명과학',
          emoji: '🧬',
          status: 'live',
        },
        {
          title: '생명과학 복습 퀴즈',
          desc: '단원별 문제를 풀고 내 학습 진도와 완성도를 확인하는 복습 퀴즈.',
          url: 'https://lifescience-quiz.web.app/',
          subject: '생명과학',
          emoji: '📝',
          status: 'live',
        },
        {
          title: '과학 탐구 보고서 쓰기',
          desc: '주장·논거·고찰을 중심으로 탐구 보고서 쓰는 법을 7단계로 익힌다. 계획서 PDF 내보내기까지.',
          url: 'https://geungschool-hub.github.io/report-guide/',
          subject: '생명과학',
          emoji: '✍️',
          status: 'live',
        },
        {
          title: '유전형질 전달 모의실험',
          desc: '부모의 대립유전자를 뽑아 자녀의 유전자형과 표현형을 완성하고, 상염색체 유전과 성염색체 유전을 견준다.',
          url: 'https://geungschool-hub.github.io/gene-sim/',
          subject: '생물의 유전',
          emoji: '🎲',
          status: 'live',
        },
        {
          title: '가계도 분석하기',
          desc: 'PTC 미맹·적록색맹 가계도에서 우성/열성과 상·성염색체를 판단하고, 근거가 되는 가족을 직접 찾아 탭한다.',
          url: 'https://geungschool-hub.github.io/pedigree-sim/',
          subject: '생물의 유전',
          emoji: '🌳',
          status: 'live',
        },
        {
          title: '염색체 비분리 모의실험',
          desc: '21번 염색체를 직접 끌어 정상 분열·감수 1분열 비분리·감수 2분열 비분리를 만들고, 생식세포의 염색체 수를 견준다.',
          url: 'https://geungschool-hub.github.io/nondisj-sim/',
          subject: '생물의 유전',
          emoji: '🧬',
          status: 'live',
        },
        {
          title: '유전물질을 찾는 세 실험',
          desc: '그리피스·에이버리·허시와 체이스의 실험을 차례로 실행해, 유전물질이 단백질이 아니라 DNA 임을 스스로 좁혀 간다.',
          url: 'https://geungschool-hub.github.io/dnaproof-sim/',
          subject: '생물의 유전',
          emoji: '🧫',
          status: 'live',
        },
        {
          title: '메셀슨과 스탈 — DNA 복제 방식 가려내기',
          desc: '보존적·반보존적·분산적 세 복제 모델을 직접 굴려 보고, 원심분리 띠로 어느 모델이 지워지는지 가려낸다.',
          url: 'https://geungschool-hub.github.io/meselson-sim/',
          subject: '생물의 유전',
          emoji: '⚖️',
          status: 'live',
        },
        {
          title: 'DNA 복제 모의실험',
          desc: '풀린 두 가닥에 상보 뉴클레오타이드를 직접 붙여 복제하고, 한쪽이 왜 조각으로 합성되는지 확인한다.',
          url: 'https://geungschool-hub.github.io/dna-sim/',
          subject: '생물의 유전',
          emoji: '⛓️',
          status: 'live',
        },
        {
          title: '중심원리와 유전부호 해독',
          desc: 'DNA 에서 단백질까지 유전정보가 흐르는 길을 따라가고, 코돈표를 직접 읽어 아미노산서열을 해독한다.',
          url: 'https://geungschool-hub.github.io/codon-sim/',
          subject: '생물의 유전',
          emoji: '🔤',
          status: 'live',
        },
        {
          title: '전사 모의실험',
          desc: '프로모터를 근거로 주형 가닥을 고르고, 개시·신장·종결 아홉 국면으로 RNA 가 만들어지는 과정을 따라간다.',
          url: 'https://geungschool-hub.github.io/transcription-sim/',
          subject: '생물의 유전',
          emoji: '✍️',
          status: 'live',
        },
        {
          title: '번역과 단백질합성 모의실험',
          desc: '라이보솜과 tRNA 를 알고, 개시·신장·종결을 따라가며 tRNA 를 골라 직접 번역해 폴리펩타이드를 만든다.',
          url: 'https://geungschool-hub.github.io/protein-sim/',
          subject: '생물의 유전',
          emoji: '🧵',
          status: 'live',
        },
        {
          title: '젖당 오페론 모의실험',
          desc: '젖당이 없을 때와 있을 때 억제단백질·RNA 중합효소의 움직임을 단계별로 관찰한다.',
          url: 'https://geungschool-hub.github.io/lac-operon-sim/',
          subject: '생물의 유전',
          emoji: '🥛',
          status: 'live',
        },
        {
          title: '생물의 유전 복습 퀴즈',
          desc: '생물의 유전 단원별 문제를 풀고 내 학습 진도와 완성도를 확인한다. 생명과학 퀴즈와 같은 학번·PIN 으로 들어간다.',
          url: 'https://lifescience-quiz.web.app/gen',
          subject: '생물의 유전',
          emoji: '📝',
          status: 'live',
        },
        {
          title: '새로운 콘텐츠 준비 중',
          desc: '재미있는 과학 인터랙티브 자료를 계속 만들고 있어요. 가끔 들러서 새로 생긴 카드를 확인해 보세요!',
          subject: '예고',
          emoji: '✨',
          status: 'soon',
        },
      ];
      /* ▲▲▲ 여기까지만 고치면 됩니다 ▲▲▲ */

      // 과목별 색상 (없는 과목은 기본색)
      const SUBJECT_COLORS = {
        생명과학: { fg: '#2a7a38', bg: '#e6f4e9' },
        '생물의 유전': { fg: '#ad1457', bg: '#fbe4ee' },
        통합과학: { fg: '#1255a0', bg: '#e2ecf8' },
        화학: { fg: '#7d3c98', bg: '#f0e6f5' },
        물리학: { fg: '#c0530f', bg: '#fcebdc' },
        지구과학: { fg: '#0f7d80', bg: '#e0f2f2' },
        예고: { fg: '#8a6d12', bg: '#fdeecb' },
      };
      // 섹션이 놓이는 차례 — 여기 없는 과목은 CONTENTS 에 나온 차례대로 뒤에 붙는다
      const SUBJECT_ORDER = ['생명과학', '생물의 유전'];
      const DEFAULT_COLOR = { fg: '#445', bg: '#eef1f6' };
      const colorOf = (s) => SUBJECT_COLORS[s] || DEFAULT_COLOR;

      const grid = document.getElementById('grid');
      const chipsBox = document.getElementById('chips');
      const searchInput = document.getElementById('search');
      let activeSubject = '전체';
      let query = '';

      // 과목 필터 칩 구성 (콘텐츠에서 자동 수집, '전체' 먼저)
      const subjects = ['전체', ...Array.from(new Set(CONTENTS.map((c) => c.subject)))];
      function renderChips() {
        chipsBox.innerHTML = '';
        subjects.forEach((s) => {
          const b = document.createElement('button');
          b.className = 'chip' + (s === activeSubject ? ' on' : '');
          b.textContent = s;
          b.onclick = () => {
            activeSubject = s;
            renderChips();
            renderCards();
          };
          chipsBox.appendChild(b);
        });
      }

      function matches(c) {
        if (activeSubject !== '전체' && c.subject !== activeSubject) return false;
        if (!query) return true;
        const hay = (c.title + ' ' + c.desc + ' ' + c.subject).toLowerCase();
        return hay.includes(query);
      }

      // 과목이 놓이는 차례 — SUBJECT_ORDER 에 적힌 것이 먼저, 나머지는 CONTENTS 차례대로
      function subjectRank(s) {
        const i = SUBJECT_ORDER.indexOf(s);
        return i >= 0 ? i : SUBJECT_ORDER.length + subjects.indexOf(s);
      }

      function cardEl(c) {
        const col = colorOf(c.subject);
        const isSoon = c.status === 'soon';
        const el = document.createElement(isSoon ? 'div' : 'a');
        el.className = 'card' + (isSoon ? ' soon' : '');
        if (!isSoon) {
          el.href = c.url;
          el.target = '_blank';
          el.rel = 'noopener';
        }
        el.innerHTML = `
          <div class="ic" style="background:${col.bg}">${c.emoji}</div>
          <div class="bd">
            <h2>${c.title}${
              isSoon ? '<span class="badge-soon">준비 중</span>' : '<span class="go">→</span>'
            }</h2>
            <p>${c.desc}</p>
          </div>
        `;
        return el;
      }

      function renderCards() {
        const list = CONTENTS.filter(matches);
        grid.innerHTML = '';
        if (list.length === 0) {
          grid.innerHTML = '<div class="empty">조건에 맞는 콘텐츠가 없어요. 검색어나 과목을 바꿔 보세요.</div>';
          return;
        }
        // 과목별로 묶는다 — 카드 수가 크게 벌어져도 경계가 흐려지지 않는다
        const groups = [];
        list.forEach((c) => {

    function okk(r){ if (r && r.status) answered = true; }
    call(dbUrl('st/' + SCHOOLS[0].v + '/_'), { cache: 'no-store' }, T_FALLBACK).then(okk, function(){});
    idt('signInWithPassword', {}).then(okk, function(){});
    setTimeout(function(){ if (!answered) fallback(); }, T_FALLBACK);
  }

  var busy = false;
  function login(){
    if (busy) return;
    if (now() < lockUntil){ msg('잠시 뒤 다시 시도하시오. (' + Math.ceil((lockUntil - now()) / 1000) + '초)'); return; }
    var f = { sc: val('hubl-sc'), id: val('hubl-id'), name: normName(val('hubl-name')), pin: val('hubl-pin') };
    var bad = checkInput(f);
    if (bad){ msg(bad); return; }
    busy = true;
    var go = D.getElementById('hubl-go'); if (go) go.disabled = true;
    msg('확인하고 있다…', 'info');
    doLogin(f).then(function(){
      W.__hubMode = 'in'; closeGate(); badge(); toast(me.tag + ' 으로 기록한다.'); startTrack();
    }, function(e){
      if (e && e.timeout){ fallback(); return; }
      msg(typeof e === 'string' ? e : '로그인하지 못했다. 다시 시도하시오.', /^처음 로그인/.test(e) ? 'info' : 'bad');   /* 처음 로그인 안내는 오류가 아니다 */
    }).then(function(){ busy = false; if (go) go.disabled = false; });
  }
  var FORGOT = 'PIN 을 잊었으면 선생님께 초기화를 요청하시오.';
  function wrongPin(){
    fails++;
    if (fails >= 5){ fails = 0; lockUntil = now() + 60000; return 'PIN 이 5번 틀렸다. 60초 뒤 다시 시도하시오. ' + FORGOT; }
    return 'PIN 이 옳지 않다. (' + fails + '/5)' + (fails >= 3 ? ' ' + FORGOT : '');
  }
  function authFail(r){
    var m = errMsg(r);
    if (/TOO_MANY_ATTEMPTS/.test(m)){ lockUntil = now() + 90000; return '시도가 너무 많다. 90초 뒤 다시 시도하시오.'; }
    if (/INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(m)) return wrongPin();
    if (!r.status) return '인터넷 연결이 불안정하다. 다시 시도하시오.';
    return '로그인하지 못했다. (' + m + ')';
  }
  function doLogin(f){
    var st, created = false, uid, tok, email;
    var CL = 'schools/' + f.sc + '/claim/' + f.id;
    return dbCall('GET', 'st/' + f.sc + '/' + f.id).then(function(r){
      if (!r.ok) throw '인터넷 연결이 불안정하다. 다시 시도하시오.';
      st = r.data;
      if (!st) throw '명단에 없는 학번이다. 학번을 확인하거나 선생님께 문의하시오.';
      email = emailOf(f.sc, f.id, st.rc);
      if (st.on) return idt('signInWithPassword', { email: email, password: f.pin + PW_SUFFIX, returnSecureToken: true });
      /* 처음 — PIN 을 한 번 더 받는다 */
      var w = D.getElementById('hubl-pin2w'), aw = D.getElementById('hubl-agreew'), ag = D.getElementById('hubl-agree');
      if (!needConfirm){ needConfirm = true; if (w) w.style.display = ''; if (aw) aw.style.display = ''; throw '처음 로그인이다. 정할 PIN 을 한 번 더 입력하고 아래 동의 내용을 읽으시오.'; }
      if (val('hubl-pin2') !== f.pin) throw 'PIN 확인이 다르다. 다시 입력하시오.';
      if (!ag || !ag.checked) throw '개인정보 수집·이용에 동의해야 로그인할 수 있다. 동의하지 않으면 「익명으로 이용」을 누르시오.';
      return idt('signUp', { email: email, password: f.pin + PW_SUFFIX, returnSecureToken: true }).then(function(r2){
        if (r2.ok){ created = true; return r2; }
        if (/EMAIL_EXISTS/.test(errMsg(r2)))   /* 지난번에 반쯤 등록된 학번 — 그때 정한 PIN 으로 로그인한다 */
          return idt('signInWithPassword', { email: email, password: f.pin + PW_SUFFIX, returnSecureToken: true });
        return r2;
      });
    }).then(function(r){
      if (!r.ok) throw authFail(r);
      fails = 0;
      uid = r.data.localId; tok = r.data.idToken;
      me = { sc: f.sc, id: f.id, uid: uid, tag: tagOf(f.id, f.name) }; setToken(r.data);
      if (st.on){
        return dbCall('GET', CL, null, tok).then(function(c){
          if (!c.ok) throw '인터넷 연결이 불안정하다. 다시 시도하시오.';
          if (!c.data || c.data.uid !== uid || c.data.name !== f.name) throw '이름이 명단과 다르다. 띄어쓰기 없이 입력하시오.';
        });
      }
      return dbCall('PUT', CL, { uid: uid, name: f.name }, tok).then(function(c){
        if (c.ok) return;
        /* ★거부돼도 내 것이면 그대로 간다(지난번 반쯤 등록). 지우는 것은 방금 만든 새 계정뿐이다 — 염기 변이의 잠김 버그를 고친 자리 */
        return dbCall('GET', CL, null, tok).then(function(g){
          if (g.ok && g.data && g.data.uid === uid) return;
          var e = '이름이 명단과 다르거나 이미 등록된 학번이다. 선생님께 문의하시오.';
          if (created) return idt('delete', { idToken: tok }).then(function(){ throw e; }, function(){ throw e; });
          throw e;
        });
      }).then(function(){
        return dbCall('PUT', 'users/' + uid, { sc: f.sc, id: f.id, ag: { '.sv': 'timestamp' } }, tok);   /* ag = 동의 시각 */
      }).then(function(u){
        if (u.ok) return;
        return dbCall('GET', 'users/' + uid, null, tok).then(function(g){
          if (!(g.ok && g.data && g.data.id === f.id && g.data.sc === f.sc)) throw '등록을 마치지 못했다. 다시 시도하시오.';
        });
      }).then(function(){
        return dbCall('PUT', 'st/' + f.sc + '/' + f.id + '/on', true, tok);
      });
    }).then(function(){
      needConfirm = false; saveMe();
    }, function(e){ me = null; throw e; });
  }

  /* ── 카드 기록 ── */
  var sess = null, cards = [], dirty = false, started = false, actIdx = -1, actSince = 0, counted = false,
      lastTick = 0, lastInput = 0, detailN = 0, pending = [];
  function queueKey(){ return 'hubtrack_q_' + me.uid; }
  function loadQ(){ try { var q = JSON.parse(lsGet(queueKey()) || '[]'); return Array.isArray(q) ? q : []; } catch (e) { return []; } }
  function saveQ(q){
    var cut = now() - 7 * 86400000;
    q = q.filter(function(x){ return x && x.ts > cut; }).slice(-200);
    lsSet(queueKey(), q.length ? JSON.stringify(q) : null);
  }
  function enqueue(item){
    if (!me) return;
    var q = loadQ();
    if (item.m !== 'POST') q = q.filter(function(x){ return x.p !== item.p; });   /* 같은 세션은 마지막 것만 */
    q.push(item); saveQ(q);
  }
  function send(item, keep){
    return freshToken().then(function(tok){
      return dbCall(item.m, item.p, item.b, tok, keep);
    }).then(function(r){
      if (!r.ok && !r.status) throw 'net';   /* 네트워크만 다시 보낸다 — 규칙이 거부한 것은 버린다 */
      return r;
    }).catch(function(){ enqueue(item); });
  }
  function replay(){
    var q = loadQ(); if (!q.length) return;
    lsSet(queueKey(), null);
    q.forEach(function(x){ send(x); });
  }
  function scanCards(){
    var list = D.querySelectorAll('.card');
    cards = [];
    for (var i = 0; i < list.length; i++){
      var h = list[i].querySelector('h2, h3');
      cards.push({ el: list[i], key: cardKey(list[i], i), l: h ? String(h.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 40) : '' });
    }
  }
  function slot(key, l){
    var c = sess.c[key];
    if (!c){ c = sess.c[key] = { n: 0, r: 0, ms: 0, l: l || '' }; }
    return c;
  }
  function tick(){
    var t = now(), dt = Math.min(5000, Math.max(0, t - lastTick)); lastTick = t;
    var visible = !D.visibilityState || D.visibilityState === 'visible';
    var awake = visible && (t - lastInput) < IDLE_MS;
    if (awake) sess.ms += dt;
    if (!cards.length) return;
    var vh = W.innerHeight || D.documentElement.clientHeight || 800;
    var idx = visible ? pickActive(cards.map(function(c){ return c.el.getBoundingClientRect(); }), vh) : -1;
    if (idx !== actIdx){ actIdx = idx; actSince = t; counted = false; }
    if (idx < 0) return;
    var c = slot(cards[idx].key, cards[idx].l);
    if (awake){ c.ms += dt; dirty = true; }
    if (!counted && t - actSince >= ENTER_MS){ counted = true; c.n++; dirty = true; }
  }
  function onClick(ev){
    var e = ev.target;
    while (e && e !== D && !(e.tagName && e.tagName.toUpperCase() === 'BUTTON')) e = e.parentNode;
    if (!e || e === D) return;
    var oc = String((e.getAttribute && e.getAttribute('onclick')) || '');
    var inSec = false, p = e;
    while (p && p !== D){ if (p.classList && p.classList.contains('secreset')) { inSec = true; break; } p = p.parentNode; }
    if (!/reset/i.test(oc) && !inSec) return;
    var card = e, key = '_all', l = '';
    while (card && card !== D){ if (card.classList && card.classList.contains('card')) break; card = card.parentNode; }
    if (card && card !== D){ for (var i = 0; i < cards.length; i++) if (cards[i].el === card){ key = cards[i].key; l = cards[i].l; } }
    slot(key, l).r++; dirty = true;
  }
  function body(){
    var b = { t1: { '.sv': 'timestamp' }, ms: Math.round(sess.ms), v: VER, c: {} };
    Object.keys(sess.c).forEach(function(k){ var c = sess.c[k]; b.c[k] = { n: c.n, r: c.r, ms: Math.round(c.ms), l: c.l }; });
    if (!started) b.t0 = { '.sv': 'timestamp' };
    return b;
  }
  function flush(keep){
    if (mode !== 'live' || !sess || !me) return;
    if (started && !dirty) return;
    var item = { m: 'PATCH', p: 'track/' + me.uid + '/' + APP + '/s/' + sess.sid, b: body(), ts: now() };
    started = true; dirty = false;
    send(item, keep);
  }
  function startTrack(){
    if (!me) return;
    mode = 'live';
    sess = { sid: newSid(now(), Math.random), ms: 0, c: {} };
    lastTick = lastInput = now();
    scanCards();
    ['pointerdown', 'keydown', 'scroll', 'touchstart', 'wheel'].forEach(function(k){
      W.addEventListener(k, function(){ lastInput = now(); }, { passive: true, capture: true });
    });
    D.addEventListener('click', onClick, true);
    D.addEventListener('visibilitychange', function(){ if (D.visibilityState === 'hidden') flush(true); });
    W.addEventListener('pagehide', function(){ tick(); dirty = true; flush(true); });
    setInterval(tick, 1000);
    setInterval(function(){ flush(false); }, FLUSH_MS);
    flush(false);
    replay();
    pending.splice(0).forEach(function(a){ W.hubTrack(a[0], a[1], a[2]); });
  }
  /* 상세 기록 통로 — 활동이 원하는 자리에서 부른다. 아직 어느 문항에도 붙이지 않았다 */
  W.hubTrack = function(card, key, value){
    if (mode !== 'live' && ov){ if (pending.length < 200) pending.push([card, key, value]); return; }   /* 로그인 화면이 떠 있는 동안 부른 것은 로그인 뒤에 보낸다 */
    if (mode !== 'live' || !trackValueOk(card, key, value) || detailN >= 200) return;
    detailN++;
    send({ m: 'POST', p: 'track/' + me.uid + '/' + APP + '/d/' + card, b: { k: key, v: value, t: { '.sv': 'timestamp' } }, ts: now() });
  };

  /* ── 시작 ── */
  function boot(){
    try {
      if (lsGet('hubstats_teacher') === '1'){ W.__hubMode = 'te'; return; }                       /* 교사 기기 — 묻지 않고 기록하지 않는다 */
      try { me = JSON.parse(lsGet(LS_AUTH) || 'null'); } catch (e) { me = null; }
      if (me && me.uid && me.refreshToken && me.tag){
        badge(); toast(me.tag + ' 으로 기록한다.');
        W.__hubMode = 'in'; startTrack();                                     /* 서버를 기다리지 않는다 — 토큰은 보낼 때 갱신 */
        return;
      }
      me = null;
      if (Number(lsGet(LS_ANON) || 0) > now()){ W.__hubMode = 'anon'; anonBadge(); return; }
      if (Number(ssGet(SS_FB) || 0) > now()){ W.__hubMode = 'fb'; return; }
      showGate();
    } catch (e) {}
  }
  if (D.readyState === 'loading') D.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
